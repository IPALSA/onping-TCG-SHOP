<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>땀켓몬 TCG샵</title>
<style>
:root{color-scheme:light;--gold:#7a63e8;--blue:#2a4fb0;--cw:min(70vw,34vh);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:#2d2a5e;background:linear-gradient(180deg,#eadffd 0%,#d5d3ff 50%,#c4dbff 100%);overflow:hidden;user-select:none;touch-action:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:64px 12px 16px}
.scr.on{display:flex}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(#aa9ef9,#7f6cea);color:#fff;border:3px solid #fff;border-radius:999px;padding:12px 34px;font-size:clamp(18px,4.5vw,24px);font-weight:900;box-shadow:0 5px 0 #5f4fc8,0 10px 24px #5f4fc855;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5f4fc8}
.btn.sm{font-size:15px;padding:8px 20px}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;background:#ffffffcc;border:2px solid #8a7cf0;color:#5f4fc8;border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px}
#setBtn{left:10px}#goldBox{right:10px;display:none;font-size:17px}
.hub{display:flex;flex-direction:column;gap:14px;width:min(80vw,320px)}.hub .btn{width:100%}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;background:#fff;border:2px solid #8a7cf0;border-radius:18px;padding:18px;display:none;gap:12px;flex-direction:column;width:min(92vw,380px);max-height:88vh;overflow:auto;touch-action:pan-y;box-shadow:0 20px 60px #0006}
#menu input[type=text],#menu input[type=password],.mdl input,.mdl select{padding:8px;border-radius:8px;border:1px solid #888;background:#fff;color:#000;width:100%}
#admArea button{width:100%;background:#8a7cf0;color:#fff;border:1px solid #6a58d8;border-radius:8px;padding:8px}
h1{font-size:clamp(36px,10vw,84px);margin:0;text-align:center;color:#fff;-webkit-text-stroke:3px #6a55d8;paint-order:stroke fill;text-shadow:0 6px 0 #6a55d8,0 0 40px #8a7cf088;letter-spacing:2px}
.sub{opacity:.8;margin:0 0 4vh;text-align:center}
.pack{width:min(56vw,250px);aspect-ratio:5/8.2;perspective:900px;cursor:grab;touch-action:none}
.box{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.pf{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;box-shadow:0 20px 40px #000a;border:2px solid #fff4}
.pf.front{background:linear-gradient(160deg,#ff5e62,#ffb300 45%,#2a4fb0)}
.pf.back{background:linear-gradient(200deg,#2a4fb0,#7b2ff7 60%,#ff5e62);transform:rotateY(180deg)}
.pf b{font-size:clamp(26px,7vw,40px);text-align:center;line-height:1.1;text-shadow:0 3px 0 #1b2a6b;-webkit-text-stroke:1px #1b2a6b}
.pf i{font-size:12px;letter-spacing:3px;font-style:normal}
.pf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff6 45%,transparent 60%)}
.band{position:absolute;top:0;left:0;right:0;height:9%;background:repeating-linear-gradient(90deg,#fff8 0 4px,#fff3 4px 8px);border-bottom:2px dashed #0006;z-index:2}
.pack.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
.pack.tear .band{transition:1s;transform:translate(60px,-160px) rotate(40deg);opacity:0}
.pack.gone{transition:.5s;transform:translateY(30%) scale(1.2);opacity:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .4s}
.hint{font-size:14px;opacity:.75;text-align:center}
.card{width:var(--cw);aspect-ratio:5/7;border-radius:6px;position:relative;overflow:hidden;background:#222;box-shadow:0 10px 30px #000a;border:2px solid #fff3;flex:none}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.ph b{font-size:calc(var(--cw)*.32);text-shadow:0 3px 0 #0006}.ph small{font-size:calc(var(--cw)*.09);opacity:.85}
.tag{position:absolute;left:5%;top:3%;font-weight:900;font-size:calc(var(--cw)*.1);background:#000a;padding:1px 7px;border-radius:6px}
.glare{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fff7,transparent 50%);mix-blend-mode:overlay;opacity:calc(var(--go,0)*.55);pointer-events:none}
.foil{position:absolute;inset:0;background:linear-gradient(115deg,#f0f,#0ff,#ff0,#f0f,#0ff);background-size:250% 250%;background-position:var(--mx,50%) var(--my,50%);mix-blend-mode:color-dodge;opacity:calc(var(--go,0)*.14);pointer-events:none}
.stage{position:relative;width:var(--cw);aspect-ratio:5/7;perspective:900px;touch-action:none}
.fly{position:absolute;inset:0;transition:transform .35s,opacity .35s}
.fly.pop{animation:pop .5s}
@keyframes pop{from{transform:translateY(60px) scale(.6);opacity:0}}
.tilt{width:100%;height:100%;transition:transform .15s}.tilt.drag{transition:none}
.hi .card{box-shadow:0 0 40px 8px var(--gl,#ffcb05),0 10px 30px #000a}
.under{position:absolute;inset:0;transform:scale(.94) translateY(8px);opacity:.6}
.grid{--cw:min(27vw,130px);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;overflow:auto;max-height:70vh;padding:6px;touch-action:pan-y}
.ov{position:fixed;inset:0;background:linear-gradient(#ece2fffa,#cbdcfffa);z-index:35;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px;overflow:auto;touch-action:pan-y}
.ov.on{display:flex}
.ov h2{margin:0 0 10px;color:var(--gold)}
.close{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:46px;height:46px;border-radius:50%;font-size:22px;font-weight:900;background:#fff;border:4px solid #3bb8a8;color:#2aa090;z-index:2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#ffffffaa;color:#5f4fc8;border:1px solid #b4a9f5;border-radius:999px;padding:6px 12px;font-weight:700}
.tabs button.on{background:#8a7cf0;color:#fff}
.tabs select{padding:6px 10px;border-radius:999px;border:1px solid #b4a9f5;background:#fff;color:#5f4fc8;font-weight:700}.dark .tabs select{background:#241f55;color:#e9e7ff}
.ov .grid{max-height:none;overflow:visible}
.cw{position:relative;background:#a99cf855;border-radius:14px;padding:6px;cursor:pointer}.cw em{position:absolute;right:4px;bottom:4px;background:#000c;border-radius:8px;padding:0 7px;font-style:normal;font-weight:800;font-size:13px}
.arow{display:grid;grid-template-columns:48px 80px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #0002;font-size:14px}
.arow input{width:100%;padding:6px;border-radius:6px;border:1px solid #888;background:#fff;color:#000}
.box2{background:#ffffff99;border-radius:12px;padding:12px;margin-bottom:12px}
.box2 select,.box2 input[type=file]{max-width:100%;padding:6px;margin:4px 0}
.mini{background:#7a2020;color:#fff;border:0;border-radius:6px;padding:4px 8px}
#skip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fffffff0;color:#3a2f8a;border:1px solid #8a7cf0;padding:8px 16px;border-radius:10px;z-index:50;display:none}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;touch-action:pan-x pan-y}
.sc{flex:none;width:84px;aspect-ratio:5/7;border-radius:6px;overflow:hidden;border:2px solid #fff4;cursor:pointer}
.sc img{width:100%;height:100%;object-fit:cover;display:block}
.sc.add{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--gold);color:var(--gold);font-weight:800;font-size:13px;line-height:1.3}
.av{width:64px;height:64px;border-radius:50%;background:#c9c0fa center/cover;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;cursor:pointer;flex:none;border:3px solid #8a7cf0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row input{width:auto!important}.row input[type=range]{flex:1}
.prof{display:flex;gap:12px;align-items:center}.prof>div{flex:1;display:flex;flex-direction:column;gap:6px}
.mdl{position:fixed;inset:0;background:#0006;z-index:45;display:none;align-items:center;justify-content:center}.mdl.on{display:flex}
.mdl>div{background:#fff;color:#2d2a5e;border-radius:18px;padding:18px;width:min(92vw,360px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.cap{font-size:13px;text-align:center;font-weight:700;margin:4px 0}
.cw .btn.sm{display:block;margin:4px auto 0;padding:5px 18px;font-size:13px}
body.dark{color:#e9e7ff;background:linear-gradient(180deg,#1b1740,#1c2257 55%,#0f1b3f)}
.dark .ov{background:linear-gradient(#17143a,#0e1a40)}
.dark .top,.dark #menu,.dark .mdl>div,.dark #toast{background:#241f55;color:#e9e7ff;border-color:#7a6cf0}
.dark .box2,.dark .cw{background:#ffffff14}.dark .tabs button{background:#ffffff14;color:#d8d3ff}
.nofx .foil,.nofx .glare{display:none}
@media (min-width:900px){:root{--cw:min(300px,42vh)}.grid{--cw:150px}}
</style></head><body>
<button class="top" id="setBtn">⚙ 설정</button>
<div class="top" id="goldBox">💰 <span id="gold">100</span> G</div>
<div id="menu"><button class="close" id="menuX" data-c="menu">✕</button>
<div class="prof"><label class="av" id="av">＋<input type="file" id="phF" accept="image/*" hidden></label><div><input id="nick" type="text" maxlength="12" placeholder="닉네임"><button class="btn sm" id="nickBtn">닉네임 변경 (24시간 1회)</button><small id="nickNote" style="display:none;opacity:.7">치지직 닉네임으로 고정되어 변경할 수 없어요</small></div></div>
<button class="btn sm" id="gBtn">치지직으로 로그인</button>
<label class="row">테마 <select id="thSel" style="width:auto"><option value="light">라이트</option><option value="dark">다크</option></select></label>
<label class="row">볼륨 <input type="range" id="vol" min="0" max="100"></label>
<label class="row">진동 <input type="checkbox" id="vib"></label>
<label class="row">빛 반사 효과 <input type="checkbox" id="holo"></label>
<button class="mini" id="reset">내 데이터 초기화</button>
<div id="admArea"><button id="admBtn">관리자 설정</button></div></div>

<section class="scr on" id="s-start">
<h1>땀켓몬<br>TCG샵</h1><p class="sub">카드팩을 뜯고 컬렉션을 완성하세요</p>
<button class="btn" id="startBtn">시작하기</button></section>

<section class="scr" id="s-hub"><h1 style="font-size:clamp(28px,7vw,48px);margin-bottom:2vh">땀켓몬 TCG샵</h1>
<div class="hub" id="hub"><button class="btn" data-h="pack">팩 개봉</button><button class="btn" data-h="col">컬렉션</button><button class="btn" data-h="trade">거래</button><button class="btn" data-h="shop">상점</button><button class="btn" data-h="ach">업적</button></div></section>

<section class="scr" id="s-pack">
<div class="pack" id="pack"><div class="box" id="box">
<div class="pf front"><div class="band"></div><b>땀켓몬<br>TCG</b><i>BOOSTER PACK</i></div>
<div class="pf back"><div class="band"></div><b>BACK</b><i>뒷면부터 열기</i></div></div><canvas id="cv" style="display:none;width:100%;height:100%"></canvas></div>
<p class="hint">카드팩을 좌우로 돌려보세요<br>앞면으로 열면 앞장부터, 뒷면으로 열면 뒷장부터!</p>
<button class="btn" id="openBtn">열기</button><button class="btn sm" id="toHub">← 메인으로</button></section>

<section class="scr" id="s-reveal">
<div class="hint" id="cnt"></div>
<div class="stage" id="stage"><div class="under" id="under"></div><div class="fly" id="fly"><div class="tilt" id="tilt"></div></div></div></section>

<section class="scr" id="s-sum"><h2 style="margin:0;color:var(--gold)">뽑은 카드</h2>
<div class="grid" id="sumGrid"></div><button class="btn" id="nextBtn">다음</button></section>

<button class="btn sm" id="skip">⏭ 스킵</button>
<div id="flash"></div><div id="toast"></div>

<div class="ov" id="colOv"><button class="close" data-c="colOv">✕</button><h2>컬렉션 <span id="colN" style="font-size:14px"></span></h2><div class="tabs" id="tabs"></div><div class="grid" id="colGrid"></div></div>

<div class="ov" id="detOv" style="align-items:center;justify-content:center;gap:16px"><button class="close" data-c="detOv">✕</button><div class="stage" id="dst" style="--cw:min(78vw,50vh,420px)"></div><div id="dinfo" style="font-weight:800;font-size:18px"></div><div style="display:flex;gap:14px"><button class="btn sm" id="dprev">◀</button><button class="btn sm" id="dnext">▶</button></div></div>
<div class="ov" id="admOv"><button class="close" data-c="admOv">✕</button><h2>관리자 메뉴</h2>
<div class="box2"><b>카드팩 3D 모델 (.glb)</b><br><input type="file" id="modelF" accept=".glb"> <button class="mini" id="modelDel">기본 카드팩으로</button><div style="font-size:12px;opacity:.7">정면이 +Z 방향을 보는 모델 권장</div></div>
<div class="box2"><b>카드 뒷면 이미지</b><br><input type="file" id="backF" accept="image/*"></div>
<div class="box2"><b>카드 추가 및 변경</b><br>등급 <select id="upG"></select> <select id="upT"><option>땀켓몬</option><option>트레이너스</option><option>아이템</option></select> <button class="btn sm" id="addTop" style="padding:4px 14px;box-shadow:none;font-size:14px">＋ 카드 추가</button>
<div class="strip" id="strip"></div><div style="font-size:12px;opacity:.7">카드를 누르면 다른 이미지로 변경할 수 있어요</div>
<input type="file" id="frontF" accept="image/*" multiple hidden><input type="file" id="repF" accept="image/*" hidden></div>
<div class="box2"><b>등급별 카드 개수 / 확률</b><div id="rows"></div><div id="tot" style="margin-top:8px;font-size:13px"></div></div></div>

<div class="mdl" id="edOv"><div><b>카드 편집</b><input id="edName" type="text" placeholder="카드 이름"><select id="edType"><option>땀켓몬</option><option>트레이너스</option><option>아이템</option></select><label class="row">개수 <input id="edCount" type="number" min="1"></label><label class="row">금액(G) <input id="edPrice" type="number" min="0"></label><button class="btn sm" id="edImg">이미지 변경</button><button class="btn sm" id="edOk">완료</button></div></div>
<div class="mdl" id="slOv"><div style="align-items:center;text-align:center"><div id="slCard" style="--cw:120px"></div><b id="slName" style="font-size:20px"></b><div id="slP"></div><div id="slV"></div><input id="slIn" type="number" min="1"><button class="btn sm" id="slOk">판매 등록</button></div></div>
<div class="ov" id="trOv"><button class="close" data-c="trOv">✕</button><h2 id="trT">거래</h2><div id="trB"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const G=['C','U','R','RR','RRR','AR','SAR','SR','UR','SSR'];
const COL={C:'#6b7280',U:'#22a06b',R:'#2a7de1',RR:'#7c4dff',RRR:'#c026d3',AR:'#e0709a',SAR:'#f59e0b',SR:'#ef4444',UR:'#eab308',SSR:'#14b8a6'};
const PW='admin1234',PACK=5;
const $=i=>document.getElementById(i);
let D={back:null,imgs:{},meta:{},counts:{C:30,U:20,R:12,RR:8,RRR:5,AR:4,SAR:3,SR:3,UR:2,SSR:1}};
let col={};
try{const d=JSON.parse(localStorage.getItem('ontcg'));if(d)D=Object.assign(D,d);col=JSON.parse(localStorage.getItem('ontcg_col'))||{}}catch(e){}
function save(){try{localStorage.setItem('ontcg',JSON.stringify(D))}catch(e){toast('저장 공간 부족: 이미지를 줄여주세요')}}
function saveCol(){try{localStorage.setItem('ontcg_col',JSON.stringify(col))}catch(e){}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$('skip').style.display=id==='s-reveal'?'block':'none';$('goldBox').style.display=id==='s-start'?'none':'block';if(id==='s-pack')setTimeout(fitM,0)}
const cnt=g=>Math.max(+D.counts[g]||0,(D.imgs[g]||[]).length);
const total=()=>G.reduce((a,g)=>a+cnt(g),0);

/* ---------- card render ---------- */
function cardEl(g,i,back){
  const c=document.createElement('div');c.className='card';
  if(back){c.innerHTML=D.back?`<img src="${D.back}">`:`<div class="ph" style="background:repeating-linear-gradient(45deg,#2a4fb0 0 12px,#1b2a6b 12px 24px)"><b>?</b></div>`;return c}
  const im=(D.imgs[g]||[])[i];
  c.innerHTML=(im?`<img src="${im}">`:`<div class="ph" style="background:linear-gradient(150deg,${COL[g]},#111 130%)"><b>${g}</b><small>No.${String(i+1).padStart(3,'0')}</small></div>`)+`<div class="tag" style="color:${COL[g]}">${g}</div>`+(G.indexOf(g)>=3?'<div class="foil"></div>':'')+'<div class="glare"></div>';
  return c}
function draw(){let t=0;const L=[];for(const g of G)for(let i=0;i<cnt(g);i++){const w=meta(g,i).count;L.push([g,i,w]);t+=w}if(!t)return null;let r=Math.random()*t;for(const [g,i,w] of L){if(r<w)return{g,i};r-=w}return{g:'C',i:0}}

/* ---------- settings / admin ---------- */
let clicks=0,ct;
function resetAdm(){$('admArea').innerHTML='<button id="admBtn">관리자 설정</button>';clicks=0;bindAdm()}
function bindAdm(){$('admBtn').onclick=()=>{clicks++;clearTimeout(ct);ct=setTimeout(()=>clicks=0,2000);if(clicks>=5){$('admArea').innerHTML='<input id="pw" type="password" placeholder="비밀번호"><button id="pwOk">확인</button>';$('pwOk').onclick=()=>{if($('pw').value===PW){$('menu').style.display='none';resetAdm();openAdm()}else{toast('비밀번호가 틀렸습니다');$('pw').value=''}}}}}
$('setBtn').onclick=()=>{const m=$('menu');m.style.display=m.style.display==='flex'?'none':'flex'};
bindAdm();
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>$(b.dataset.c).classList.remove('on'));
function readImg(f,h){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,h/im.height),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}
function openAdm(){$('upG').innerHTML=G.map(g=>`<option>${g}</option>`).join('');renderAdm();$('admOv').classList.add('on')}
function renderAdm(){
  const t=tw();
  $('rows').innerHTML=G.map(g=>`<div class="arow"><b style="color:${COL[g]}">${g}</b><input type="number" min="0" data-g="${g}" value="${cnt(g)}"><span id="p-${g}">${t?(gw(g)/t*100).toFixed(2):0}%</span><span>🖼${(D.imgs[g]||[]).length}</span></div>`).join('');
  $('tot').textContent='총 카드 수: '+t+' (확률 = 등급 카드 수 ÷ 총 카드 수)';renderStrip()}

$('trB').onclick=e=>{const t=e.target.closest('[data-t],[data-f],[data-buy],.cw');if(!t)return;const d=t.dataset;
 if(d.t==='sort')sortI=(sortI+1)%3;else if(d.t)trV=d.t;else if(d.f)fT=d.f;else if(d.buy){buy(d.buy);return}else if(d.k&&trV==='sell'){openSl(d.k);return}else return;trR()};
function buy(id){const l=MK.L.find(x=>String(x.id)===id);if(!l)return;if(gold<l.p){toast('골드가 부족해요');return}setGold(gold-l.p);col[l.k]=(col[l.k]||0)+1;saveCol();MK.T.push({k:l.k,p:l.p,t:Date.now()});MK.L=MK.L.filter(x=>x!==l);saveMk();beep(880);toast(meta(kk(l.k).g,kk(l.k).i).name+' 구매 완료');trR()}
let sk=null;
function openSl(k){sk=k;const {g,i}=kk(k),p=mprice(k);$('slCard').innerHTML='';$('slCard').appendChild(cardEl(g,i));$('slName').textContent=meta(g,i).name;$('slP').textContent='현재 시세 '+p+' G';$('slV').textContent='최근 24시간 거래량 '+vol24(k)+'건';$('slIn').value=p;$('slOv').classList.add('on')}
$('slOv').addEventListener('click',e=>{if(e.target===$('slOv'))$('slOv').classList.remove('on')});
$('slOk').onclick=()=>{const p=Math.round(+$('slIn').value),mp=mprice(sk);if(!(p>0)){toast('금액을 입력하세요');return}if(p>mp*1.5){toast('시세의 150%를 넘으면 판매가 어려워요');return}if(!col[sk])return;col[sk]--;if(!col[sk])delete col[sk];saveCol();const l={id:Date.now(),s:'me',k:sk,p,t:Date.now()};MK.L.push(l);saveMk();$('slOv').classList.remove('on');toast('판매 등록됨 · 구매자를 기다리는 중');trR();
 setTimeout(()=>{setGold(gold+p);MK.T.push({k:l.k,p,t:Date.now()});MK.L=MK.L.filter(x=>x!==l);saveMk();beep(880);toast('판매 완료 +'+p+' G')},3000)};
MK.L.filter(l=>l.s==='me').forEach(l=>{setGold(gold+l.p);MK.T.push({k:l.k,p:l.p,t:Date.now()})});MK.L=MK.L.filter(l=>l.s!=='me');saveMk();
applyS();
